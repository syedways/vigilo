name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: vigilo-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MISE_ENABLE_TOOLS: go,lisette,hk,jactionlint,gitleaks,pkl,taplo
  MISE_LOCKED: "1"
  MISE_NO_HOOKS: "1"

jobs:
  verify:
    name: Vigilo CI
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-ci-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}

      - name: Set up mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: "2026.11.11"
          cache: false
          env: false
          add_shims_to_path: false

      - name: Lint, test, and build
        run: mise run verify
