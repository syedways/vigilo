[tools]
go = "1.27"
node = "26.13.1"
aube = "2.10.1"
bun = "1.4.5"
lisette = { version = "0.13.1", version_prefix = "lisette-v" }
watchexec = "latest"

# formatting/linting
hk = "2.13.0"
jactionlint = "2.6.0"
gitleaks = "latest"
pkl = "0.33.1"
taplo = "0.10.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-x64-musl"]

[hooks]
postinstall = "mise run hooks:install"

[tasks."hooks:install"]
description = "Install this clone's Git hooks with the mise environment"
run = "hk install --mise"

[tasks.lint]
description = "Validate hk and check all files without modifying or staging them"
run = ["hk validate --deny-warnings", "hk check --all --check --safe"]

[tasks.fix]
description = "Apply hk fixes to all files without staging them"
run = "hk fix --all --no-stage --safe"

[tasks.vigilo]
description = "Compile and run vigilo"
alias = "default"
raw_args = true
sources = ["src/**/*.lis", "lisette.toml"]
# always start the app, even when sources have not changed.
outputs = []
run = "lis run . --"

[tasks.dev]
description = "Watch and run vigilo with an optional config path"
dir = "{{config_root}}"
raw = true
quiet = true
run = '''
#!/bin/sh
set -eu
if [ "$#" -gt 1 ]; then
  printf 'usage: mise run dev [path]\n' >&2
  exit 2
fi
config=${1-vigilo.dev.toml}
config_dir=$(realpath -m -- "$(dirname -- "$config")")
root=$(pwd -P)

escape_glob() {
  printf '%s\n' "$1" | sed 's/[][\\*?{}]/\\&/g; s/ $/\\ /'
}
config_filter=$(escape_glob "${config_dir%/}/$(basename -- "$config")")
root_filter=$(escape_glob "$root")

# watch directories so a rename into place is seen as well as a write.
exec watchexec --quiet --restart --stop-timeout 10s --wrap-process group \
  --ignore-nothing --project-origin / --watch src --watch-non-recursive . \
  --watch-non-recursive "$config_dir" \
  --filter "$root_filter/src/**/*.lis" --filter "$root_filter/lisette.toml" \
  --filter "$config_filter" --shell none -- sh -c '
    trap "exit 0" INT TERM
    lis run . -- server "$1" || :
  ' vigilo-dev "$config"
'''

[tasks.build]
description = "Build the application binary"
run = "lis build"

[tasks.check]
description = "Lint and type check the project"
run = "lis check"

[tasks.format]
description = "Format Lisette source files"
alias = "fmt"
run = "lis format"

[tasks."format:check"]
description = "Check source formatting without modifying files"
run = "lis format --check"

[tasks.test]
description = "Run the Lisette test suite"
run = "lis test"

[tasks."test:integration"]
description = "Build Vigilo and run the server integration tests"
depends = ["build"]
run = "bun test ./tests/server.integration.test.ts"

[tasks.sync]
description = "Reconcile dependencies with Go imports"
run = "lis sync"

[tasks.verify]
description = "Run lint, Lisette tests, and server integration tests in sequence"
run = [{ task = "lint" }, { task = "test" }, { task = "test:integration" }]

[tasks.docs]
description = "Run a docs package script"
dir = "site"
run = '''
#!/bin/sh
script=${1:?usage: mise run docs <script> [args...]}
shift
exec aube run --no-install "$script" -- "$@"
'''

[tasks."docs:install"]
description = "Install docs dependencies from the lockfile"
dir = "site"
run = "aube ci --ignore-scripts --disable-global-virtual-store"

[tasks."docs:preview"]
description = "Install locked dependencies and start the local docs preview"
depends = ["docs:install"]
run = [
  "aube -C site/deploy ci --ignore-scripts",
  "aube -C site run --no-install preview",
]
